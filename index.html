<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart RollCall – AI & DS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --google-blue: #4268f4;
            --google-red: #ea4335;
            --google-green: #0b902f;
            --google-yellow: #fbbc05;
            --dark: #202124;
            --bg: #f0f2f5;
            --glass: rgba(255, 255, 255, 0.85);
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            min-height: 100vh;
            color: #1a1b1f;
            background: linear-gradient(-45deg, #0f172a, #1e3a8a, #064e3b, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            will-change: background-position;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        #portal-selection {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .dept-headline {
            background: rgba(255, 255, 255, 0.95);
            color: #0f172a;
            border: 2px solid var(--google-yellow);
            padding: 14px 40px;
            border-radius: 18px;
            font-weight: 900;
            font-size: 1.3rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            margin-bottom: 15px;
            text-align: center;
        }

        .portal-sections {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 10px;
        }

        .section-card {
            background: white;
            padding: 45px 40px;
            border-radius: 25px;
            width: 250px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 2px solid transparent;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-decoration: none;
            color: inherit;
        }

        .section-card:hover {
            transform: scale(1.05) translateY(-5px);
        }

        .section-card.attender-section:hover {
            border-color: var(--google-red);
            box-shadow: 0 0 25px 8px rgba(234, 67, 53, 0.3);
        }

        .section-card.hod-section:hover {
            border-color: var(--google-blue);
            box-shadow: 0 0 25px 8px rgba(66, 133, 244, 0.3);
        }

        .section-icon {
            font-size: 3.5rem;
            margin-bottom: 10px;
        }

        .section-card h2 {
            margin: 0 0 5px 0;
            font-size: 1.5rem;
            font-weight: 800;
        }

        .section-card p {
            color: #70757a;
            font-size: 0.85rem;
            margin: 0;
            font-weight: 600;
        }

        .college-logo-main {
            height: 120px;
            margin-bottom: 10px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>
    <div id="portal-selection">
        <img src="RCE_LOGO.png" alt="RCE Logo" class="college-logo-main">
        <div class="dept-headline">🏛️ Department of AI & DS</div>
        <h1 style="font-weight: 800; color: white; text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); margin-top: 0; text-align: center;">
            Smart RollCall <span style="color:var(--google-yellow)">AI & DS</span>
        </h1>

        <div class="portal-sections">
            <a href="attender.html" class="section-card attender-section">
                <div class="section-icon">🔑</div>
                <h2>Attender Portal</h2>
                <p>Scanner and Exit Gate Verification</p>
            </a>
            <a href="hod.html" class="section-card hod-section">
                <div class="section-icon">🏛️</div>
                <h2>HOD Panel</h2>
                <p>Grant Permissions & Consolidated Reports</p>
            </a>
        </div>
    </div>
</body>

</html>
